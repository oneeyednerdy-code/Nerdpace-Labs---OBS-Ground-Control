name: Bug report
description: Report an Streamer Mission Control problem on Windows
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Windows version
      options:
        - Windows 10 x64
        - Windows 11 x64
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Streamer Mission Control version
      placeholder: v0.8.0-alpha.7
    validations:
      required: true

  - type: input
    id: obs
    attributes:
      label: OBS Studio version
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce

  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Never include stream keys, OAuth tokens, passwords, private URLs, or device serial numbers.
