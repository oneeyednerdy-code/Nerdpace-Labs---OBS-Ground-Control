name: Release Windows

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set app version from release tag
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          python scripts/set-version.py $version

      - name: Restore
        run: dotnet restore src/Nerdspace.OBSRecovery/Nerdspace.OBSRecovery.csproj

      - name: Build
        run: dotnet build src/Nerdspace.OBSRecovery/Nerdspace.OBSRecovery.csproj -c Release --no-restore

      - name: Publish Windows x64
        run: dotnet publish src/Nerdspace.OBSRecovery/Nerdspace.OBSRecovery.csproj -c Release -r win-x64 --self-contained true --no-restore -o publish/win-x64

      - name: Package portable build
        shell: pwsh
        run: Compress-Archive -Path publish/win-x64/* -DestinationPath "Nerdspace-OBS-Ground-Control-$env:GITHUB_REF_NAME-win-x64.zip"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $publishDir = (Resolve-Path 'publish/win-x64').Path
          $iscc = @(
            "${env:ProgramFiles}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup compiler not found after installation." }
          & $iscc "/DMyAppVersion=$version" "/DPublishDir=$publishDir" "installer\GroundControl.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: SHA-256
        shell: pwsh
        run: |
          $files = @(
            (Get-ChildItem "Nerdspace-OBS-Ground-Control-*-win-x64.zip" | Select-Object -First 1),
            (Get-ChildItem "dist\Nerdspace-OBS-Ground-Control-Setup-*.exe" | Select-Object -First 1)
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content SHA256SUMS.txt -Encoding ascii

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Nerdspace-OBS-Ground-Control-Setup-*.exe
            Nerdspace-OBS-Ground-Control-*-win-x64.zip
            SHA256SUMS.txt
