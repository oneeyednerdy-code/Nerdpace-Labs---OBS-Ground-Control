name: Release Windows

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Configure Mission Control self-update feed
        shell: pwsh
        env:
          NETSPARKLE_PUBLIC_KEY: ${{ vars.NETSPARKLE_PUBLIC_KEY }}
        run: |
          python scripts/configure-self-update.py --repository "$env:GITHUB_REPOSITORY" --public-key "$env:NETSPARKLE_PUBLIC_KEY"

      - name: Build preloaded OBS plugin catalog
        run: python scripts/refresh-plugin-catalog.py --require-min-resources 250

      - name: Verify preloaded plugin catalog
        shell: pwsh
        run: |
          $catalog = Get-Content 'src/Nerdspace.OBSRecovery/Data/plugin-catalog.json' -Raw | ConvertFrom-Json
          if ($catalog.resourceCount -lt 250) { throw "OBS plugin catalog is unexpectedly small: $($catalog.resourceCount)" }
          Write-Host "Embedding $($catalog.resourceCount) OBS resources; $($catalog.sourceVerifiedCount) publish source URLs."

      - name: Set app version from release tag
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          python scripts/set-version.py $version

      - name: Restore
        run: dotnet restore src/Nerdspace.OBSRecovery/Nerdspace.OBSRecovery.csproj

      - name: Build
        run: dotnet build src/Nerdspace.OBSRecovery/Nerdspace.OBSRecovery.csproj -c Release --no-restore

      - name: Publish Windows x64
        run: dotnet publish src/Nerdspace.OBSRecovery/Nerdspace.OBSRecovery.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false --no-restore -o publish/win-x64

      - name: Verify self-contained publish
        shell: pwsh
        run: |
          $exe = "publish/win-x64/NerdSpace.StreamerMissionControl.exe"
          if (-not (Test-Path $exe)) { throw "Published Mission Control executable was not produced." }
          $project = [xml](Get-Content src/Nerdspace.OBSRecovery/Nerdspace.OBSRecovery.csproj)
          $props = $project.Project.PropertyGroup
          if (($props.SelfContained | Select-Object -First 1) -ne 'true') { throw "SelfContained must remain true for installer releases." }
          if (($props.PublishSingleFile | Select-Object -First 1) -ne 'true') { throw "PublishSingleFile must remain true for installer releases." }
          Write-Host "Verified: Windows publish is self-contained on .NET 10 and does not require a separately installed .NET runtime or SDK."

      - name: Package portable build
        shell: pwsh
        run: Compress-Archive -Path publish/win-x64/* -DestinationPath "NerdSpace-Streamer-Mission-Control-$env:GITHUB_REF_NAME-win-x64.zip"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $publishDir = (Resolve-Path 'publish/win-x64').Path
          $iscc = @(
            "${env:ProgramFiles}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup compiler not found after installation." }
          & $iscc "/DMyAppVersion=$version" "/DPublishDir=$publishDir" "installer\StreamerMissionControl.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: SHA-256
        shell: pwsh
        run: |
          $files = @(
            (Get-ChildItem "NerdSpace-Streamer-Mission-Control-*-win-x64.zip" | Select-Object -First 1),
            (Get-ChildItem "dist\NerdSpace-Streamer-Mission-Control-Setup-*.exe" | Select-Object -First 1)
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content SHA256SUMS.txt -Encoding ascii

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: NerdSpace Labs - Streamer Mission Control ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/NerdSpace-Streamer-Mission-Control-Setup-*.exe
            NerdSpace-Streamer-Mission-Control-*-win-x64.zip
            SHA256SUMS.txt

      - name: Check updater signing configuration
        id: updater_signing
        shell: pwsh
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.NETSPARKLE_PRIVATE_KEY }}
          SPARKLE_PUBLIC_KEY: ${{ vars.NETSPARKLE_PUBLIC_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SPARKLE_PRIVATE_KEY) -or
              [string]::IsNullOrWhiteSpace($env:SPARKLE_PUBLIC_KEY)) {
            Write-Warning "NetSparkle signing keys are not configured. GitHub release succeeded, but the in-app Update Now feed will not be refreshed."
            "configured=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }
          "configured=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install NetSparkle appcast generator
        if: steps.updater_signing.outputs.configured == 'true'
        shell: pwsh
        run: dotnet tool install --global NetSparkleUpdater.Tools.AppCastGenerator --version 2.9.0

      - name: Generate signed Mission Control appcast
        if: steps.updater_signing.outputs.configured == 'true'
        shell: pwsh
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.NETSPARKLE_PRIVATE_KEY }}
          SPARKLE_PUBLIC_KEY: ${{ vars.NETSPARKLE_PUBLIC_KEY }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $baseUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME"
          $stage = Join-Path $env:RUNNER_TEMP "mission-control-update-feed"
          $binary = Join-Path $stage "binary"
          $out = Join-Path $stage "out"

          New-Item -ItemType Directory -Force -Path $binary, $out | Out-Null
          Copy-Item (Get-ChildItem "dist\NerdSpace-Streamer-Mission-Control-Setup-*.exe" | Select-Object -First 1).FullName $binary

          $args = @(
            "-a", $out,
            "-b", $binary,
            "-e", "exe",
            "-o", "windows",
            "-n", "NerdSpace Labs - Streamer Mission Control",
            "-u", $baseUrl,
            "--file-version", $version
          )

          $isPreview = $version.Contains("-")
          if ($isPreview) {
            $args += @("--channel", "preview")
          }

          & netsparkle-generate-appcast @args
          if ($LASTEXITCODE -ne 0) { throw "NetSparkle appcast generation failed." }

          $sourceCast = Join-Path $out "appcast.xml"
          $sourceSig = "$sourceCast.signature"
          if (-not (Test-Path $sourceCast) -or -not (Test-Path $sourceSig)) {
            throw "NetSparkle did not produce appcast.xml and appcast.xml.signature."
          }

          $publish = Join-Path $stage "publish"
          New-Item -ItemType Directory -Force -Path $publish | Out-Null

          if ($isPreview) {
            Copy-Item $sourceCast (Join-Path $publish "appcast-preview.xml")
            Copy-Item $sourceSig (Join-Path $publish "appcast-preview.xml.signature")
          } else {
            # Stable releases refresh both feeds so preview testers naturally
            # graduate to the newest stable release.
            Copy-Item $sourceCast (Join-Path $publish "appcast-stable.xml")
            Copy-Item $sourceSig (Join-Path $publish "appcast-stable.xml.signature")
            Copy-Item $sourceCast (Join-Path $publish "appcast-preview.xml")
            Copy-Item $sourceSig (Join-Path $publish "appcast-preview.xml.signature")
          }

          "feed_dir=$publish" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        id: generate_appcast

      - name: Publish fixed signed update feed
        if: steps.updater_signing.outputs.configured == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $feed = "${{ steps.generate_appcast.outputs.feed_dir }}"

          gh release view update-feed --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create update-feed `
              --repo "$env:GITHUB_REPOSITORY" `
              --target main `
              --title "Streamer Mission Control Update Feed" `
              --notes "Machine-readable signed update metadata used by Streamer Mission Control. Normal users should download versioned releases instead." `
              --prerelease
          }

          Get-ChildItem $feed -File | ForEach-Object {
            gh release upload update-feed $_.FullName `
              --repo "$env:GITHUB_REPOSITORY" `
              --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload $($_.Name) to update-feed release." }
          }
