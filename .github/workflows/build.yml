name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Configure Mission Control self-update feed
        shell: pwsh
        env:
          NETSPARKLE_PUBLIC_KEY: ${{ vars.NETSPARKLE_PUBLIC_KEY }}
        run: |
          python scripts/configure-self-update.py --repository "$env:GITHUB_REPOSITORY" --public-key "$env:NETSPARKLE_PUBLIC_KEY"

      - name: Refresh preloaded OBS plugin catalog
        continue-on-error: true
        run: python scripts/refresh-plugin-catalog.py --require-min-resources 250

      - name: Restore
        run: dotnet restore src/Nerdspace.OBSRecovery/Nerdspace.OBSRecovery.csproj

      - name: Build
        run: dotnet build src/Nerdspace.OBSRecovery/Nerdspace.OBSRecovery.csproj -c Release --no-restore

      - name: Publish Windows x64
        run: dotnet publish src/Nerdspace.OBSRecovery/Nerdspace.OBSRecovery.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false --no-restore -o publish/win-x64

      - name: Verify self-contained publish
        shell: pwsh
        run: |
          $exe = "publish/win-x64/NerdSpace.StreamerMissionControl.exe"
          if (-not (Test-Path $exe)) { throw "Published Mission Control executable was not produced." }
          $project = [xml](Get-Content src/Nerdspace.OBSRecovery/Nerdspace.OBSRecovery.csproj)
          $props = $project.Project.PropertyGroup
          if (($props.SelfContained | Select-Object -First 1) -ne 'true') { throw "SelfContained must remain true for installer releases." }
          if (($props.PublishSingleFile | Select-Object -First 1) -ne 'true') { throw "PublishSingleFile must remain true for installer releases." }
          Write-Host "Verified: Windows publish is self-contained on .NET 10 and does not require a separately installed .NET runtime or SDK."

      - name: Package portable build
        shell: pwsh
        run: Compress-Archive -Path publish/win-x64/* -DestinationPath NerdSpace-Streamer-Mission-Control-win-x64.zip

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/Nerdspace.OBSRecovery/Nerdspace.OBSRecovery.csproj
          $version = $project.Project.PropertyGroup.Version | Select-Object -First 1
          $publishDir = (Resolve-Path 'publish/win-x64').Path
          $iscc = @(
            "${env:ProgramFiles}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup compiler not found after installation." }
          & $iscc "/DMyAppVersion=$version" "/DPublishDir=$publishDir" "installer\StreamerMissionControl.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - uses: actions/upload-artifact@v4
        with:
          name: NerdSpace-Streamer-Mission-Control-Windows
          path: |
            NerdSpace-Streamer-Mission-Control-win-x64.zip
            dist/NerdSpace-Streamer-Mission-Control-Setup-*.exe
